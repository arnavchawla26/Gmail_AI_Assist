<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Gmail AI Assist — Settings</title></head>
  <body style="font-family:system-ui; max-width:720px; margin:40px auto; padding:0 16px;">
    <h2>Gmail AI Assist — Settings</h2>
    <p>Paste your <b>OpenRouter API key</b> and choose models. Unlimited usage.</p>

    <label>API Key</label><br>
    <input id="apiKey" type="password" placeholder="sk-or-..." style="width:100%; padding:8px;"><br><br>

    <label>Draft Model</label><br>
    <select id="modelDraft" style="width:100%; padding:8px;">
      <option value="openai/gpt-3.5-turbo">GPT-3.5 Turbo (draft)</option>
      <option value="mistral/mistral-tiny">Mistral Tiny</option>
      <option value="openrouter/auto">Auto</option>
    </select><br><br>

    <label>Summary Model</label><br>
    <select id="modelSummary" style="width:100%; padding:8px;">
      <option value="anthropic/claude-3-haiku">Claude 3 Haiku (summarize)</option>
      <option value="openai/gpt-3.5-turbo">GPT-3.5 Turbo</option>
      <option value="mistral/mistral-tiny">Mistral Tiny</option>
      <option value="openrouter/auto">Auto</option>
    </select><br><br>

    <button id="save" style="padding:8px 12px;">Save</button>
    <span id="status" style="margin-left:10px;"></span>

    <script src="options.js"></script>
  </body>
</html>
